name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.9.3)"
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --force

      - name: Verify release tag matches package version
        env:
          TAG_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG_REF#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Check if version already published
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view safari-mcp@$PACKAGE_VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION already published — skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION not found — will publish"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public

      - name: Sync server.json version to match package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = pkg.version;
            if (Array.isArray(s.packages)) {
              for (const p of s.packages) p.version = pkg.version;
            }
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
          "
          cat server.json

      - name: Download mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH=amd64; fi
          if [ "$ARCH" = "aarch64" ]; then ARCH=arm64; fi
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help | head -3

      - name: Publish to MCP Registry
        run: |
          # The registry validates that the npm version already exists, and npm's public
          # index lags its own publish by a few seconds — so a same-job publish races it
          # and fails with a 404 on a version that is genuinely there (v2.17.0 hit this).
          # Wait for npm to actually serve the version, then retry the publish itself.
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if curl -sf "https://registry.npmjs.org/safari-mcp/${VERSION}" -o /dev/null; then
              echo "npm is serving ${VERSION} (attempt ${attempt})"
              break
            fi
            echo "npm has not indexed ${VERSION} yet (attempt ${attempt}) — waiting 10s"
            sleep 10
          done

          ./mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "MCP Registry publish failed (attempt ${attempt}) — retrying in 20s"
            sleep 20
          done
          echo "::error::MCP Registry publish failed after 3 attempts"
          exit 1
