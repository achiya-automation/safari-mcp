<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; padding: 16px; font-family: -apple-system, system-ui, sans-serif; font-size: 13px; margin: 0; }
    h3 { margin: 0 0 12px; font-size: 15px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .connected { background: #4CAF50; }
    .disconnected { background: #f44336; }
    .paused, .unpaired { background: #FF9800; }
    .checking { background: #FF9800; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .info { color: #666; font-size: 11px; margin-bottom: 12px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid #e0e0e0; }
    .toggle-label { font-size: 13px; font-weight: 500; }
    .toggle { position: relative; width: 42px; height: 24px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; transition: 0.2s; }
    .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
    .toggle input:checked + .slider { background: #4CAF50; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    #pairForm[hidden] { display: none; }
    .steps { margin: -4px 0 4px; padding-left: 18px; }
    .steps li { margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .row code { flex: 1; font-size: 12px; background: #f2f2f2; border-radius: 4px; padding: 5px 6px; user-select: all; }
    #pairCode { flex: 1; min-width: 0; font-size: 14px; letter-spacing: 1px; padding: 5px 6px; border: 1px solid #ccc; border-radius: 4px; }
    #pairCode:focus { outline: 2px solid #4CAF50; outline-offset: -1px; border-color: transparent; }
    button { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    #pairButton { background: #4CAF50; border-color: #4CAF50; color: #fff; font-weight: 600; }
    #pairButton:disabled { opacity: 0.6; cursor: default; }
    .pair-message { font-size: 11px; min-height: 14px; margin-bottom: 8px; }
    .pair-message.error { color: #c62828; }
    .pair-message.ok { color: #2e7d32; }
  </style>
</head>
<body>
  <h3>Safari MCP Bridge</h3>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking...</span>
  </div>
  <div class="info" id="info"></div>
  <form id="pairForm" hidden>
    <ol class="steps">
      <li>In Terminal, run:
        <div class="row">
          <code class="mono" id="pairCommand">npx safari-mcp pair</code>
          <button type="button" id="copyCommand">Copy</button>
        </div>
      </li>
      <li><label for="pairCode">Enter the code it prints:</label>
        <div class="row">
          <input id="pairCode" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" required>
          <button type="submit" id="pairButton">Pair</button>
        </div>
      </li>
    </ol>
    <div class="pair-message" id="pairMessage" role="status" aria-live="polite"></div>
  </form>
  <div class="toggle-row">
    <span class="toggle-label">Active</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
